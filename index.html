<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Health Benchmark Directory</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://jsdelivr.net"></script>
    <!-- Retro Pixel Typography Font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Space Mono', monospace; background-color: #000000; image-rendering: pixelated; }
        .font-pixel { font-family: 'Press Start 2P', cursive; }
        
        /* Pixel-art border styling rules */
        .pixel-box {
            border: 4px solid #FFFFFF;
            box-shadow: 6px 6px 0px #1e293b;
            background-color: #000000;
        }
        .pixel-btn-active {
            border: 4px solid #06b6d4;
            color: #06b6d4;
            background-color: #083344;
        }
        .pixel-input {
            background-color: #000000;
            border: 4px solid #334155;
            color: #FFFFFF;
        }
        .pixel-input:focus {
            outline: none;
            border-color: #06b6d4;
        }
    </style>
</head>
<body class="text-white min-h-screen antialiased py-8 px-4">

    <div class="max-w-md mx-auto flex flex-col min-h-screen justify-between">
        
        <!-- Header Section -->
        <header class="text-center mb-8 border-b-4 border-dashed border-slate-800 pb-4">
            <h1 class="font-pixel text-xs leading-relaxed tracking-wider text-cyan-400">
                SG HEALTH BENCHMARK
            </h1>
            <p class="text-xs text-slate-400 mt-2 uppercase font-bold tracking-tight">DEMOGRAPHIC ASSESSMENT MODULE // V1.0</p>
        </header>

        <!-- Main Display Frame -->
        <main class="flex-grow flex flex-col justify-center">
            
            <!-- STEP 1: Basic Biometrics -->
            <div id="step-1" class="pixel-box p-5 space-y-6">
                <div class="border-b-2 border-slate-800 pb-2">
                    <span class="font-pixel text-[9px] text-slate-400">STAGE 01 / BIOMETRICS</span>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2 font-bold">Select Gender Group</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setGender('Male')" id="gender-male" class="py-2.5 border-4 border-slate-700 bg-black text-xs font-bold hover:bg-slate-900 transition cursor-pointer text-slate-300 text-center uppercase">Male</button>
                            <button onclick="setGender('Female')" id="gender-female" class="py-2.5 border-4 border-slate-700 bg-black text-xs font-bold hover:bg-slate-900 transition cursor-pointer text-slate-300 text-center uppercase">Female</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">Age Group</label>
                            <input type="number" id="input-age" placeholder="e.g. 28" class="w-full pixel-input text-sm rounded-none px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">Sleep (Hours)</label>
                            <input type="number" id="input-sleep" step="0.5" placeholder="e.g. 7" class="w-full pixel-input text-sm rounded-none px-3 py-2">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">Height (cm)</label>
                            <input type="number" id="input-height" placeholder="e.g. 175" class="w-full pixel-input text-sm rounded-none px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">Weight (kg)</label>
                            <input type="number" id="input-weight" placeholder="e.g. 68" class="w-full pixel-input text-sm rounded-none px-3 py-2">
                        </div>
                    </div>
                </div>

                <button onclick="goToStep2()" class="w-full bg-white text-black font-bold py-3 hover:bg-slate-200 transition cursor-pointer text-xs uppercase tracking-wider border-b-4 border-slate-400">
                    Next: Activity metrics →
                </button>
            </div>

            <!-- STEP 2: Activity Selection -->
            <div id="step-2" class="pixel-box p-5 hidden space-y-6">
                <div class="border-b-2 border-slate-800 pb-2">
                    <span class="font-pixel text-[9px] text-slate-400">STAGE 02 / ACTIVITY</span>
                </div>
                
                <div class="space-y-3">
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">Select Daily Step Bracket</label>
                    <button onclick="setSteps(3000)" id="step-opt-1" class="w-full text-left px-4 py-3 border-4 border-slate-700 bg-black text-xs text-slate-200 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center uppercase">
                        <span>Sedentary Bracket</span> <span class="text-slate-500">&lt; 5,000</span>
                    </button>
                    <button onclick="setSteps(6500)" id="step-opt-2" class="w-full text-left px-4 py-3 border-4 border-slate-700 bg-black text-xs text-slate-200 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center uppercase">
                        <span>Typical Bracket</span> <span class="text-slate-500">5k - 7.5k</span>
                    </button>
                    <button onclick="setSteps(8500)" id="step-opt-3" class="w-full text-left px-4 py-3 border-4 border-slate-700 bg-black text-xs text-slate-200 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center uppercase">
                        <span>Active Bracket</span> <span class="text-slate-500">7.5k - 10k</span>
                    </button>
                    <button onclick="setSteps(12000)" id="step-opt-4" class="w-full text-left px-4 py-3 border-4 border-slate-700 bg-black text-xs text-slate-200 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center uppercase">
                        <span>Exceptional Bracket</span> <span class="text-slate-500">10k+ Steps</span>
                    </button>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">Workouts This Week (30+ Mins)</label>
                    <input type="number" id="input-workouts" placeholder="e.g. 3" class="w-full pixel-input text-sm rounded-none px-3 py-2">
                </div>

                <div class="flex gap-3 pt-2">
                    <button onclick="backToStep1()" class="w-1/3 border-4 border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-900 transition cursor-pointer uppercase">Back</button>
                    <button onclick="goToStep3()" class="w-2/3 bg-white text-black font-bold py-3 hover:bg-slate-200 transition cursor-pointer text-xs uppercase tracking-wider border-b-4 border-slate-400">Cardio →</button>
                </div>
            </div>

            <!-- STEP 3: Advanced Cardio Performance -->
            <div id="step-3" class="pixel-box p-5 hidden space-y-6">
                <div class="border-b-2 border-slate-800 pb-2">
                    <span class="font-pixel text-[9px] text-slate-400">STAGE 03 / ADVANCED ATHLETICS</span>
                </div>
                <p class="text-xs text-slate-400 leading-relaxed uppercase">Optional performance fields for running metrics. Leave fields empty if not tracked.</p>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">2.4km Run Timing (MM:SS)</label>
                        <input type="text" id="run-24" placeholder="e.g. 12:30" class="w-full pixel-input text-sm rounded-none px-3 py-2">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">5km Run (Mins)</label>
                            <input type="number" id="run-5" placeholder="e.g. 26" class="w-full pixel-input text-sm rounded-none px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">10km Run (Mins)</label>
                            <input type="number" id="run-10" placeholder="e.g. 55" class="w-full pixel-input text-sm rounded-none px-3 py-2">
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button onclick="backToStep2()" class="w-1/3 border-4 border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-900 transition cursor-pointer uppercase">Back</button>
