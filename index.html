<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Health Index // The Daily Dive</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://jsdelivr.net"></script>
    <!-- Google Fonts for the Krillion aesthetic -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070B; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-mono-tech { font-family: 'Space Mono', monospace; }
        .glass-panel {
            background: rgba(13, 18, 30, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Custom Custom Input Styles for Krillion Look */
        .krillion-input {
            background: transparent;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease;
        }
        .krillion-input:focus {
            outline: none;
            border-color: #06b6d4; /* Cyan accent */
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen antialiased selection:bg-cyan-500 selection:text-black">

    <div class="max-w-md mx-auto px-6 py-12 flex flex-col min-h-screen justify-between">
        
        <!-- Top Nav Branding -->
        <header class="flex justify-between items-center mb-10 border-b border-white/5 pb-4">
            <div class="font-display font-black tracking-tighter text-lg text-white">SG.HEALTH<span class="text-cyan-500 font-mono-tech text-xs ml-1 font-normal">//V1.0</span></div>
            <div class="font-mono-tech text-[10px] uppercase text-slate-500 tracking-widest bg-white/5 px-2.5 py-1 rounded-full">One in a Krillion</div>
        </header>

        <!-- Dynamic View Card wrapper -->
        <main class="flex-grow flex flex-col justify-center">
            
            <!-- STEP 1: Biometrics Interface -->
            <div id="step-1" class="space-y-8 animate-fade-in">
                <div>
                    <h1 class="font-display text-4xl font-extrabold tracking-tight text-white leading-tight">
                        Measure your baseline. <br><span class="text-slate-500">Face the metric matrix.</span>
                    </h1>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-3">01 / Choose Cohort Profile</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setGender('Male')" id="gender-male" class="py-3 font-display rounded-xl bg-white/5 border border-white/5 text-sm font-semibold hover:bg-white/10 transition cursor-pointer text-slate-400">Male Pool</button>
                            <button onclick="setGender('Female')" id="gender-female" class="py-3 font-display rounded-xl bg-white/5 border border-white/5 text-sm font-semibold hover:bg-white/10 transition cursor-pointer text-slate-400">Female Pool</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">02 / Exact Age</label>
                            <input type="number" id="input-age" placeholder="--" class="w-full krillion-input text-xl font-display py-2 text-white">
                        </div>
                        <div>
                            <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">03 / Sleep (Hours)</label>
                            <input type="number" id="input-sleep" step="0.5" placeholder="--" class="w-full krillion-input text-xl font-display py-2 text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">04 / Stature (cm)</label>
                            <input type="number" id="input-height" placeholder="--" class="w-full krillion-input text-xl font-display py-2 text-white">
                        </div>
                        <div>
                            <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">05 / Mass (kg)</label>
                            <input type="number" id="input-weight" placeholder="--" class="w-full krillion-input text-xl font-display py-2 text-white">
                        </div>
                    </div>
                </div>

                <button onclick="goToStep2()" class="w-full bg-white text-black font-display font-bold py-4 rounded-xl transition hover:bg-slate-200 cursor-pointer text-center text-sm tracking-wide shadow-lg shadow-white/5 mt-4">
                    PROCEED TO MOVEMENT CAPTURE →
                </button>
            </div>

            <!-- STEP 2: The Movement Quiz Interface -->
            <div id="step-2" class="hidden space-y-8">
                <div>
                    <h2 class="font-display text-3xl font-extrabold tracking-tight text-white">Weekly Load.</h2>
                    <p class="text-slate-500 text-xs mt-1">Select your standard kinetic movement output tier.</p>
                </div>
                
                <div class="space-y-3">
                    <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">06 / Daily Step Velocity</label>
                    <button onclick="setSteps(3000)" id="step-opt-1" class="w-full text-left px-4 py-4 rounded-xl glass-panel text-xs text-slate-400 hover:border-cyan-500/50 transition cursor-pointer flex justify-between items-center">
                        <span>🛋️ Desk-Bound Casualty</span> <span class="font-mono-tech text-slate-600">&lt; 5,000 steps</span>
                    </button>
                    <button onclick="setSteps(6500)" id="step-opt-2" class="w-full text-left px-4 py-4 rounded-xl glass-panel text-xs text-slate-400 hover:border-cyan-500/50 transition cursor-pointer flex justify-between items-center">
                        <span>🚶 Standard Transit Commuter</span> <span class="font-mono-tech text-slate-600">5k - 7.5k steps</span>
                    </button>
                    <button onclick="setSteps(8500)" id="step-opt-3" class="w-full text-left px-4 py-4 rounded-xl glass-panel text-xs text-slate-400 hover:border-cyan-500/50 transition cursor-pointer flex justify-between items-center">
                        <span>🏃 Intentional Tracked Movement</span> <span class="font-mono-tech text-slate-600">7.5k - 10k steps</span>
                    </button>
                    <button onclick="setSteps(12000)" id="step-opt-4" class="w-full text-left px-4 py-4 rounded-xl glass-panel text-xs text-slate-400 hover:border-cyan-500/50 transition cursor-pointer flex justify-between items-center">
                        <span>⚡ Kinetic Anomalous Activity</span> <span class="font-mono-tech text-slate-600">10,000+ steps</span>
                    </button>
                </div>

                <div>
                    <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">07 / Workouts Last Week (30+ Mins)</label>
                    <input type="number" id="input-workouts" placeholder="0" class="w-full krillion-input text-xl font-display py-2 text-white">
                </div>

                <div class="flex gap-4 pt-4">
                    <button onclick="backToStep1()" class="w-1/3 border border-white/10 rounded-xl py-3 font-display text-xs text-slate-400 hover:bg-white/5 transition cursor-pointer">← BACK</button>
                    <button onclick="goToStep3()" class="w-2/3 bg-white text-black font-display font-bold py-3 rounded-xl hover:bg-slate-200 transition cursor-pointer text-xs tracking-wide">CARDIO METRICS →</button>
                </div>
            </div>

            <!-- STEP 3: Advanced Fitness Interface -->
            <div id="step-3" class="hidden space-y-8">
                <div>
                    <h2 class="font-display text-3xl font-extrabold tracking-tight text-white">Aerobic Thresholds.</h2>
                    <p class="text-slate-500 text-xs mt-1">Optional parameters for advanced running tracking profiles.</p>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">08 / 2.4km Time (MM:SS)</label>
                        <input type="text" id="run-24" placeholder="e.g. 11:45" class="w-full krillion-input text-xl font-display py-2 text-white">
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">09 / 5km Run (Mins)</label>
                            <input type="number" id="run-5" placeholder="--" class="w-full krillion-input text-xl font-display py-2 text-white">
                        </div>
                        <div>
                            <label class="font-mono-tech text-[10px] uppercase tracking-widest text-slate-500 block mb-1">10 / 10km Run (Mins)</label>
