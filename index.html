<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Health Index // The Daily Dive</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://jsdelivr.net"></script>
    <!-- Google Fonts for High-Contrast Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F19; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-mono-tech { font-family: 'Space Mono', monospace; }
        .glass-panel {
            background: #151D30;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .krillion-input {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
            transition: all 0.2s ease;
        }
        .krillion-input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.15);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen antialiased">

    <div class="max-w-md mx-auto px-5 py-8 flex flex-col min-h-screen justify-between">
        
        <!-- Top Nav Branding -->
        <header class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <div class="font-display font-black tracking-tighter text-lg text-white">SG.HEALTH<span class="text-cyan-400 font-mono-tech text-xs ml-1 font-normal">//V1.0</span></div>
            <div class="font-mono-tech text-[10px] uppercase text-cyan-400 tracking-widest bg-cyan-950/50 px-3 py-1 rounded-full border border-cyan-800/30">METRIC MATRIX</div>
        </header>

        <!-- Dynamic View Card Wrapper -->
        <main class="flex-grow flex flex-col justify-center">
            
            <!-- STEP 1: Biometrics Interface -->
            <div id="step-1" class="space-y-6">
                <div>
                    <h1 class="font-display text-3xl font-extrabold tracking-tight text-white leading-tight">
                        Measure your baseline. <br><span class="text-slate-400">Face the cohort data.</span>
                    </h1>
                </div>
                
                <div class="space-y-5">
                    <div>
                        <label class="font-mono-tech text-[11px] uppercase tracking-widest text-slate-400 block mb-2 font-bold">01 / Choose Cohort Profile</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setGender('Male')" id="gender-male" class="py-3 font-display rounded-xl bg-slate-800 border border-slate-700 text-sm font-semibold hover:bg-slate-700 transition cursor-pointer text-slate-200 text-center">Male Pool</button>
                            <button onclick="setGender('Female')" id="gender-female" class="py-3 font-display rounded-xl bg-slate-800 border border-slate-700 text-sm font-semibold hover:bg-slate-700 transition cursor-pointer text-slate-200 text-center">Female Pool</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="font-mono-tech text-[11px] uppercase tracking-widest text-slate-400 block mb-1 font-bold">02 / Exact Age</label>
                            <input type="number" id="input-age" placeholder="e.g. 25" class="w-full krillion-input text-base rounded-xl px-4 py-2.5">
                        </div>
                        <div>
                            <label class="font-mono-tech text-[11px] uppercase tracking-widest text-slate-400 block mb-1 font-bold">03 / Sleep (Hours)</label>
                            <input type="number" id="input-sleep" step="0.5" placeholder="e.g. 6.5" class="w-full krillion-input text-base rounded-xl px-4 py-2.5">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="font-mono-tech text-[11px] uppercase tracking-widest text-slate-400 block mb-1 font-bold">04 / Stature (cm)</label>
                            <input type="number" id="input-height" placeholder="e.g. 175" class="w-full krillion-input text-base rounded-xl px-4 py-2.5">
                        </div>
                        <div>
                            <label class="font-mono-tech text-[11px] uppercase tracking-widest text-slate-400 block mb-1 font-bold">05 / Mass (kg)</label>
                            <input type="number" id="input-weight" placeholder="e.g. 70" class="w-full krillion-input text-base rounded-xl px-4 py-2.5">
                        </div>
                    </div>
                </div>

                <button onclick="goToStep2()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-display font-bold py-4 rounded-xl transition cursor-pointer text-center text-sm tracking-wide shadow-md shadow-cyan-500/10 mt-2">
                    PROCEED TO MOVEMENT CAPTURE →
                </button>
            </div>

            <!-- STEP 2: The Movement Quiz Interface -->
            <div id="step-2" class="hidden space-y-6">
                <div>
                    <h2 class="font-display text-2xl font-extrabold tracking-tight text-white">Weekly Load Thresholds.</h2>
                    <p class="text-slate-400 text-xs mt-1">Select your average kinetic movement output tier below.</p>
                </div>
                
                <div class="space-y-3">
                    <label class="font-mono-tech text-[11px] uppercase tracking-widest text-slate-400 block mb-1 font-bold">06 / Daily Step Velocity</label>
                    <button onclick="setSteps(3000)" id="step-opt-1" class="w-full text-left px-4 py-3.5 rounded-xl bg-slate-800/80 border border-slate-700 text-sm text-slate-200 hover:bg-slate-700 transition cursor-pointer flex justify-between items-center">
                        <span class="font-semibold">🛋️ Desk-Bound Casualty</span> <span class="font-mono-tech text-xs bg-slate-900 px-2 py-0.5 rounded text-slate-400">&lt; 5k steps</span>
                    </button>
                    <button onclick="setSteps(6500)" id="step-opt-2" class="w-full text-left px-4 py-3.5 rounded-xl bg-slate-800/80 border border-slate-700 text-sm text-slate-200 hover:bg-slate-700 transition cursor-pointer flex justify-between items-center">
                        <span class="font-semibold">🚶 Standard Transit Commuter</span> <span class="font-mono-tech text-xs bg-slate-900 px-2 py-0.5 rounded text-slate-400">5k - 7.5k</span>
                    </button>
                    <button onclick="setSteps(8500)" id="step-opt-3" class="w-full text-left px-4 py-3.5 rounded-xl bg-slate-800/80 border border-slate-700 text-sm text-slate-200 hover:bg-slate-700 transition cursor-pointer flex justify-between items-center">
                        <span class="font-semibold">🏃 Intentional Movement</span> <span class="font-mono-tech text-xs bg-slate-900 px-2 py-0.5 rounded text-slate-400">7.5k - 10k</span>
                    </button>
                    <button onclick="setSteps(12000)" id="step-opt-4" class="w-full text-left px-4 py-3.5 rounded-xl bg-slate-800/80 border border-slate-700 text-sm text-slate-200 hover:bg-slate-700 transition cursor-pointer flex justify-between items-center">
                        <span class="font-semibold">⚡ Kinetic High Output</span> <span class="font-mono-tech text-xs bg-slate-900 px-2 py-0.5 rounded text-slate-400">10k+ steps</span>
                    </button>
                </div>

                <div>
                    <label class="font-mono-tech text-[11px] uppercase tracking-widest text-slate-400 block mb-1 font-bold">07 / Workouts Last Week (30+ Mins)</label>
                    <input type="number" id="input-workouts" placeholder="e.g. 3" class="w-full krillion-input text-base rounded-xl px-4 py-2.5">
                </div>

                <div class="flex gap-4 pt-2">
                    <button onclick="backToStep1()" class="w-1/3 bg-slate-800 border border-slate-700 rounded-xl py-3 font-display text-xs font-bold text-slate-300 hover:bg-slate-700 transition cursor-pointer">← BACK</button>
                    <button onclick="goToStep3()" class="w-2/3 bg-cyan-500 text-black font-display font-bold py-3 rounded-xl hover:bg-cyan-400 transition cursor-pointer text-xs tracking-wide">CARDIO METRICS →</button>
                </div>
            </div>

            <!-- STEP 3: Advanced Fitness Interface -->
            <div id="step-3" class="hidden space-y-6">
                <div>
                    <h2 class="font-display text-2xl font-extrabold tracking-tight text-white">Aerobic Thresholds.</h2>
                    <p class="text-slate-400 text-xs mt-1">Optional parameters for active running tracking profiles. Leave blank to skip.</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="font-mono-tech text-[11px] uppercase tracking-widest text-slate-400 block mb-1 font-bold">08 / 2.4km Time (MM:SS)</label>
                        <input type="text" id="run-24" placeholder="e.g. 11:30" class="w-full krillion-input text-base rounded-xl px-4 py-2.5">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
